global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts_rules.yml"

scrape_configs:
  - job_name: "soc-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]